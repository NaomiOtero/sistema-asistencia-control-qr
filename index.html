<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Control de Asistencia QR</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="container" style="padding-top: 4rem;">
    <div class="card">
      <div class="logo">QR Asistencia <span>Sistema de control de acceso</span></div>

      <div class="alert alert-error" id="alertError"></div>

      <div class="form-group mt-3">
        <label class="form-label" for="email">Correo electrónico</label>
        <input class="form-control" type="email" id="email" placeholder="alumno@escuela.edu.mx" autocomplete="email">
        <div class="form-error" id="emailError">Ingresa un correo válido</div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Contraseña</label>
        <input class="form-control" type="password" id="password" placeholder="Mínimo 6 caracteres" autocomplete="current-password">
        <div class="form-error" id="passError">La contraseña es obligatoria</div>
      </div>

      <button class="btn btn-primary" id="btnLogin">
        <span class="spinner" id="spinner"></span>
        Iniciar sesión
      </button>

      <p class="text-muted text-center mt-2">
        ¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a>
      </p>
    </div>
  </div>

  <script type="module">
    import { auth, db } from './js/firebase-config.js';
    import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const btnLogin  = document.getElementById('btnLogin');
    const spinner   = document.getElementById('spinner');
    const alertErr  = document.getElementById('alertError');

    function showError(el, msg) {
      el.textContent = msg;
      el.classList.add('visible');
    }
    function clearErrors() {
      document.querySelectorAll('.form-error').forEach(e => e.classList.remove('visible'));
      document.querySelectorAll('.form-control').forEach(e => e.classList.remove('error'));
      alertErr.classList.remove('visible');
    }
    function validate() {
      let ok = true;
      const email = document.getElementById('email').value.trim();
      const pass  = document.getElementById('password').value;
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        showError(document.getElementById('emailError'), 'Ingresa un correo válido');
        document.getElementById('email').classList.add('error');
        ok = false;
      }
      if (pass.length < 6) {
        showError(document.getElementById('passError'), 'Mínimo 6 caracteres');
        document.getElementById('password').classList.add('error');
        ok = false;
      }
      return ok;
    }

    btnLogin.addEventListener('click', async () => {
      clearErrors();
      if (!validate()) return;

      spinner.classList.add('visible');
      btnLogin.disabled = true;

      try {
        const cred = await signInWithEmailAndPassword(
          auth,
          document.getElementById('email').value.trim(),
          document.getElementById('password').value
        );
        // Verificar rol en Firestore
        const snap = await getDoc(doc(db, 'usuarios', cred.user.uid));
        const data = snap.data();
        if (data?.rol === 'admin') {
          window.location.href = 'admin/dashboard.html';
        } else {
          window.location.href = 'perfil.html';
        }
      } catch (err) {
        const msgs = {
          'auth/user-not-found': 'No existe una cuenta con ese correo',
          'auth/wrong-password': 'Contraseña incorrecta',
          'auth/too-many-requests': 'Demasiados intentos. Intenta más tarde',
          'auth/invalid-credential': 'Correo o contraseña incorrectos',
        };
        alertErr.textContent = msgs[err.code] || 'Error al iniciar sesión';
        alertErr.classList.add('visible');
      } finally {
        spinner.classList.remove('visible');
        btnLogin.disabled = false;
      }
    });

    // Enter para submit
    document.getElementById('password').addEventListener('keydown', e => {
      if (e.key === 'Enter') btnLogin.click();
    });
  </script>
</body>
</html>
